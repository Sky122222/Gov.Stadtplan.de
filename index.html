<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Los Santos Government – Stadtplan</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f3f2;--ink:#111;--mut:#6b6b6b;--line:#d9d9d7;--acc:#8fe3a8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.seal{width:40px;height:40px;display:grid;place-items:center;background:#111;color:#fff;font-weight:600;font-size:15px;border-radius:50%}
.brand b{display:block;font-size:17px;line-height:1.2}
.brand small{color:var(--mut);font-size:12.5px}
nav{display:flex;gap:22px;font-size:14px}
nav a{color:var(--mut);text-decoration:none}
nav a:first-child{color:var(--ink);border-bottom:2px solid var(--ink)}
#clk{display:none;font:600 20px 'Barlow Condensed',sans-serif;letter-spacing:.08em}
main{flex:1;display:flex;min-height:0}
#mapwrap{position:relative;flex:1;min-width:0}
#map{position:absolute;inset:0;background:#0fa8d6;outline:0}
#layers{position:absolute;top:12px;left:56px;z-index:900;display:flex;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
#layers button{border:0;background:none;padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--mut)}
#layers button.on{background:#111;color:#fff}
#xy{display:none;position:absolute;left:12px;bottom:12px;z-index:900;font:500 14px 'Barlow Condensed',sans-serif;letter-spacing:.08em;color:var(--acc);background:rgba(0,0,0,.7);padding:3px 10px}
aside{display:none;width:300px;background:#0b0b0b;color:#d6d6d6;border-left:1px solid #2a2a2a;padding:16px;overflow:auto}
aside h3{margin:18px 0 8px;font:600 15px 'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#fff}
aside h3:first-child{margin-top:0}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tools button,.pp button,#out{font:inherit;font-size:13px;background:#161616;color:#d6d6d6;border:1px solid #333;padding:7px 8px;cursor:pointer;text-align:left}
.tools button:hover,.pp button:hover,#out:hover{border-color:#777}
.tools button.on{border-color:var(--acc);color:var(--acc)}
#list{display:flex;flex-direction:column;gap:2px}
#list a{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;font-size:13px;cursor:pointer;border-left:2px solid #333}
#list a:hover{background:#181818}
#list span{color:#777}
#stat{font-size:12.5px;color:#888}
#stat.ok{color:var(--acc)}
#out{margin-top:18px;width:100%;text-align:center}
footer{display:flex;justify-content:space-between;padding:8px 20px;font-size:12.5px;color:#aaa;background:#1b1b1b}
footer a{color:#aaa;cursor:default}
/* Kommandomodus */
body.cmd{background:#050505;color:#d6d6d6}
.cmd header{background:#0b0b0b;border-color:#2a2a2a}
.cmd .seal{background:none;border:1px solid var(--acc);color:var(--acc);border-radius:2px;font-family:'Barlow Condensed',sans-serif;letter-spacing:.1em}
.cmd .brand b{font:600 20px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#fff}
.cmd .brand small{color:#777}
.cmd nav{display:none}
.cmd #clk,.cmd aside,.cmd #xy{display:block}
.cmd #layers{border-color:#333;background:#0b0b0b}
.cmd #layers button{color:#999}
.cmd #layers button.on{background:#222;color:var(--acc)}
.cmd .leaflet-image-layer{filter:grayscale(.5) brightness(.82) contrast(1.1)}
.cmd #map{background:#050a0d}
.cmd #mapwrap::after{content:'';position:absolute;inset:0;z-index:600;pointer-events:none;background:linear-gradient(rgba(143,227,168,.06) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,rgba(143,227,168,.06) 1px,transparent 1px) 0 0/56px 56px,radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.4))}
.cmd footer{background:#0b0b0b;color:#555}
.mk{width:28px;height:28px;display:grid;place-items:center;background:#0b0b0b;border:2px solid var(--c);color:var(--c);font:600 12px 'Barlow Condensed',sans-serif;box-shadow:0 0 12px var(--c);transform:rotate(45deg)}
.mk i{font-style:normal;transform:rotate(-45deg)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0b0b0b;color:#d6d6d6;border:1px solid #333;border-radius:0}
.pp{display:flex;flex-direction:column;gap:6px;min-width:170px}
.pp b{font:600 14px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.pp input{background:#161616;border:1px solid #333;color:#fff;padding:6px;font:inherit}
#boot{position:fixed;inset:0;z-index:5000;background:#000;color:var(--acc);font:500 17px 'Barlow Condensed',sans-serif;letter-spacing:.1em;padding:12vh 8vw;display:none;white-space:pre-line;transition:opacity .5s}
#gate{position:fixed;inset:0;z-index:4000;background:rgba(0,0,0,.55);display:none;place-items:center}
#gate div{background:#fff;padding:20px;border-radius:6px;display:flex;gap:8px}
#gate input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:4px;width:180px}
#gate input.bad{border-color:#c33}
#gate button{font:inherit;background:#111;color:#fff;border:0;border-radius:4px;padding:8px 14px;cursor:pointer}
@media(max-width:800px){main{flex-direction:column}aside{width:auto;max-height:42vh;border-left:0;border-top:1px solid #2a2a2a}nav{display:none}}
@media(prefers-reduced-motion:reduce){#boot{transition:none}}
.mk.st-b{border-style:dashed;box-shadow:none}
.mk.st-z{filter:grayscale(1);opacity:.55;box-shadow:none}
.pp select,.pp textarea{background:#161616;border:1px solid #333;color:#fff;padding:6px;font:inherit;font-size:13px}
.pp textarea{resize:vertical;min-height:54px}
.pp small{color:#999}
.sw{display:flex;gap:6px;margin-top:8px}
.sw button{width:26px;height:26px;border:2px solid #333;cursor:pointer;padding:0}
.sw button.on{border-color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:inherit;font-size:12px;padding:3px 8px;background:#161616;color:#d6d6d6;border:1px solid #444;cursor:pointer}
.chip.off{opacity:.35;text-decoration:line-through}
.tooling #map,.tooling .leaflet-grab{cursor:crosshair}
.leaflet-tooltip.mt{background:#0b0b0b;color:#fff;border:1px solid #555;border-radius:0}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="seal" id="seal">LS</span><div><b id="bt">Los Santos Government</b><small id="bs">Amt für Stadtplanung und Geoinformation</small></div></div>
  <div id="clk"></div>
</header>
<main>
  <div id="mapwrap">
    <div id="map" tabindex="-1"></div>
    <div id="layers"><button data-l="karte" class="on">Stadtplan</button><button data-l="sat">Luftbild</button></div>
    <div id="xy"></div>
  </div>
  <aside id="side"></aside>
</main>
<footer><span>© Los Santos Government</span><a id="v">Version 3.2.1</a></footer>
<div id="gate"><div><input id="code" type="password" placeholder="Zugangscode" autocomplete="off"><button id="go">OK</button></div></div>
<div id="boot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== KONFIGURATION ===== */
const CODE = 'DOD';
// Firebase Realtime Database URL ohne Slash am Ende, z.B. 'https://MEIN-PROJEKT-default-rtdb.europe-west1.firebasedatabase.app'
// Leer = Speicherung nur im eigenen Browser.
const DB_URL = 'https://govseite-default-rtdb.europe-west1.firebasedatabase.app';
// Position der Insel in den Bildern (Anteil 0-1). Zum Nachjustieren des Luftbilds anpassen.
const K = {x0:.192,x1:.79,y0:.076,y1:.961};   // karte.jpg
const S = {x0:.126,x1:.937,y0:.046,y1:.96};   // satellit.jpg
const LUFTBILD = false;   // true = Luftbild-Umschalter wieder anzeigen (satellit.jpg)
const M_PER_UNIT = 0;     // Meter pro Karteneinheit (Karte = 1000 Einheiten breit). 0 = Angaben in Einheiten (E)
/* ========================= */

const TYPES = {
  silo:['Raketensilo','R','#ff5a4d'], base:['Armeestützpunkt','B','#e8e8e8'], aa:['Flugabwehr','F','#f0b24a'],
  radar:['Radarstation','Ra','#8fe3a8'], air:['Luftwaffenbasis','L','#9ac7ff'], navy:['Marinestützpunkt','M','#6fa8dc'], hq:['Hauptquartier','HQ','#ffffff']
};
const $ = s => document.querySelector(s);
const map = L.map('map',{crs:L.CRS.Simple,minZoom:-1.5,maxZoom:3,zoomSnap:.25,attributionControl:false,maxBounds:[[-150,-150],[1150,1150]],maxBoundsViscosity:.8});
const KB = [[0,0],[1000,1000]];
const sx=(K.x1-K.x0)/(S.x1-S.x0), sy=(K.y1-K.y0)/(S.y1-S.y0);
const bx0=K.x0-S.x0*sx, by0=K.y0-S.y0*sy;
const SB = [[1000*(1-(by0+sy)),1000*bx0],[1000*(1-by0),1000*(bx0+sx)]];
const imgs = {karte:L.imageOverlay('karte.jpg',KB), sat:L.imageOverlay('satellit.jpg',SB)};
let cur=null;
function setLayer(n){
  if(cur) map.removeLayer(imgs[cur]);
  cur=n; imgs[n].addTo(map);
  $('#map').style.background = n==='sat' ? '#0a1030' : '#0fa8d6';
  document.querySelectorAll('#layers button').forEach(b=>b.classList.toggle('on',b.dataset.l===n));
}
document.querySelectorAll('#layers button').forEach(b=>b.onclick=()=>setLayer(b.dataset.l));
map.fitBounds(KB); setLayer('karte'); $('#layers').style.display=LUFTBILD?'flex':'none';

/* ---- Zugang ---- */
$('#v').onclick = () => { $('#gate').style.display='grid'; $('#code').value=''; $('#code').focus(); };
$('#gate').onclick = e => { if(e.target.id==='gate') $('#gate').style.display='none'; };
function tryCode(){
  const i=$('#code');
  if(i.value.trim().toUpperCase()===CODE){ $('#gate').style.display='none'; enter(true); }
  else { i.classList.add('bad'); i.value=''; setTimeout(()=>i.classList.remove('bad'),600); }
}
$('#go').onclick=tryCode; $('#code').onkeydown=e=>{ if(e.key==='Enter') tryCode(); };

/* ---- Datenhaltung ---- */
const DB = DB_URL.replace(/\/$/,'');
const db = {
  async all(k){ if(!DB) return JSON.parse(localStorage.getItem('ls_'+k)||'{}'); const r=await fetch(`${DB}/${k}.json`); if(!r.ok) throw 0; return (await r.json())||{}; },
  async put(k,id,o){ if(!DB){ const a=await this.all(k); a[id]=o; localStorage.setItem('ls_'+k,JSON.stringify(a)); return; } const r=await fetch(`${DB}/${k}/${id}.json`,{method:'PUT',body:JSON.stringify(o)}); if(!r.ok) throw 0; },
  async del(k,id){ if(!DB){ const a=await this.all(k); delete a[id]; localStorage.setItem('ls_'+k,JSON.stringify(a)); return; } const r=await fetch(`${DB}/${k}/${id}.json`,{method:'DELETE'}); if(!r.ok) throw 0; }
};
const STATUS={a:'Aktiv',b:'Im Bau',z:'Zerstört'}, RAD=['silo','radar','aa'], COLORS=['#8fe3a8','#ff5a4d','#6fa8dc','#f0b24a','#ffffff'];
let data={markers:{},shapes:{}}, mk={}, sh={}, tool=null, col=COLORS[0], pts=[], mpts=[], tmp=null, mline=null, mlab=null, btns={}, hidden=new Set(), busy=0, popOpen=0, timer=null, clock=null;
const group=L.layerGroup(), cmd=()=>document.body.classList.contains('cmd');
const fmt=u=>M_PER_UNIT?((u*=M_PER_UNIT)>=1000?(u/1000).toFixed(1)+' km':Math.round(u)+' m'):Math.round(u)+' E';
const pt=(x,y)=>[1000*(1-y),1000*x];
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function el(tag,txt){ const e=document.createElement(tag); if(txt!=null) e.textContent=txt; return e; }
function btn(txt,fn){ const b=el('button',txt); b.onclick=fn; return b; }
function icon(o){ const [,c,cl]=TYPES[o.t]; return L.divIcon({className:'',html:`<div class="mk st-${o.s||'a'}" style="--c:${cl}"><i>${c}</i></div>`,iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-16]}); }
function popMk(id){
  const o=data.markers[id], d=el('div'); d.className='pp';
  const i=el('input'); i.value=o.n; i.maxLength=60;
  const st=el('select'); for(const [k,v] of Object.entries(STATUS)){ const p=el('option',v); p.value=k; st.append(p); } st.value=o.s||'a';
  const nt=el('textarea'); nt.value=o.note||''; nt.placeholder='Notiz'; nt.maxLength=500;
  d.append(el('b',TYPES[o.t][0]),i,st);
  let rg=null;
  if(RAD.includes(o.t)){ rg=el('input'); rg.type='range'; rg.min=0; rg.max=300; rg.value=o.r||0; const lb=el('small');
    const up=()=>lb.textContent='Radius: '+(+rg.value>0?fmt(+rg.value):'aus'); rg.oninput=up; up(); d.append(lb,rg); }
  d.append(nt,
    btn('Speichern',async()=>{ o.n=i.value.trim()||TYPES[o.t][0]; o.s=st.value; o.note=nt.value.trim(); if(rg) o.r=+rg.value; await write(()=>db.put('markers',id,o)); map.closePopup(); redraw(); }),
    btn('Löschen',async()=>{ delete data.markers[id]; await write(()=>db.del('markers',id)); map.closePopup(); redraw(); }));
  return d;
}
function popSh(id){
  const o=data.shapes[id], d=el('div'); d.className='pp';
  const i=el('input'); i.value=o.n; i.maxLength=60;
  const nt=el('textarea'); nt.value=o.note||''; nt.placeholder='Notiz'; nt.maxLength=500;
  d.append(el('b',o.k==='zone'?'Zone':'Linie'),i,nt,
    btn('Speichern',async()=>{ o.n=i.value.trim()||o.n; o.note=nt.value.trim(); await write(()=>db.put('shapes',id,o)); map.closePopup(); redraw(); }),
    btn('Löschen',async()=>{ delete data.shapes[id]; await write(()=>db.del('shapes',id)); map.closePopup(); redraw(); }));
  return d;
}
async function write(fn){ busy=1; try{ await fn(); setSt(true); }catch(e){ setSt(false); } busy=0; }
function redraw(){
  group.clearLayers(); mk={}; sh={};
  for(const [id,o] of Object.entries(data.markers)){
    if(!TYPES[o.t]||hidden.has(o.t)) continue;
    const p=pt(o.x,o.y);
    if(o.r>0&&RAD.includes(o.t)) L.circle(p,{radius:o.r,color:TYPES[o.t][2],weight:1.5,fillOpacity:.1,interactive:false}).addTo(group);
    mk[id]=L.marker(p,{icon:icon(o),title:o.n}).bindPopup(()=>popMk(id)).addTo(group);
  }
  for(const [id,o] of Object.entries(data.shapes)){
    if(hidden.has(o.k)||!o.p) continue;
    const p=o.p.map(q=>pt(q[0],q[1]));
    sh[id]=(o.k==='zone'?L.polygon(p,{color:o.c,weight:2,fillOpacity:.18}):L.polyline(p,{color:o.c,weight:3,dashArray:'8 6'})).bindPopup(()=>popSh(id)).addTo(group);
  }
  renderList();
}
function renderList(){
  const l=$('#list'); if(!l) return; l.replaceChildren(); const rows=[];
  for(const id in mk){ const o=data.markers[id]; rows.push([o.t,o.n,TYPES[o.t][1]+(o.s&&o.s!=='a'?' · '+STATUS[o.s]:''),TYPES[o.t][2],()=>{ map.flyTo(mk[id].getLatLng(),1.5); mk[id].openPopup(); }]); }
  for(const id in sh){ const o=data.shapes[id]; rows.push([o.k,o.n,o.k==='zone'?'Zone':'Linie',o.c,()=>{ map.flyToBounds(sh[id].getBounds(),{maxZoom:1.5}); sh[id].openPopup(); }]); }
  rows.sort((a,b)=>a[0].localeCompare(b[0]));
  if(!rows.length){ const e=el('div','Keine Einträge. Werkzeug wählen und auf die Karte klicken.'); e.style.cssText='font-size:13px;color:#777'; l.append(e); }
  rows.forEach(r=>{ const a=el('a'); a.style.borderColor=r[3]; a.append(el('div',r[1]),el('span',r[2])); a.onclick=r[4]; l.append(a); });
  $('#cnt').textContent=rows.length;
}
function setSt(ok){ const s=$('#stat'); if(!s) return; s.className=ok?'ok':''; s.textContent=ok?(DB?'Verbunden, Daten werden geteilt':'Lokaler Modus, nur dieser Browser'):'Keine Verbindung zur Datenbank'; }
async function sync(){
  if(busy) return;
  try{ const [m,s]=await Promise.all([db.all('markers'),db.all('shapes')]); setSt(true);
    if(JSON.stringify([m,s])!==JSON.stringify([data.markers,data.shapes]) && !popOpen){ data={markers:m,shapes:s}; redraw(); } }
  catch(e){ setSt(false); }
}
/* ---- Werkzeuge ---- */
function resetTemp(){ pts=[]; mpts=[]; [tmp,mline,mlab].forEach(l=>l&&map.removeLayer(l)); tmp=mline=mlab=null; }
function sel(){ for(const k in btns) btns[k].classList.toggle('on',k===tool); document.body.classList.toggle('tooling',!!tool); }
function setTool(k){ tool=k===tool?null:k; resetTemp(); sel(); }
function preview(){
  if(tmp) map.removeLayer(tmp); if(!pts.length){ tmp=null; return; }
  const p=pts.map(q=>pt(q[0],q[1])), o={color:col,weight:2,dashArray:'4 4'};
  tmp=(tool==='zone'&&p.length>2?L.polygon(p,o):L.polyline(p,o)).addTo(map);
}
function mpreview(){
  if(mline) map.removeLayer(mline); if(mlab) map.removeLayer(mlab);
  let t=0; for(let i=1;i<mpts.length;i++) t+=map.distance(mpts[i-1],mpts[i]);
  mline=L.polyline(mpts,{color:'#fff',weight:2,dashArray:'6 6'}).addTo(map);
  mlab=L.tooltip({permanent:true,direction:'right',className:'mt'}).setContent(mpts.length>1?'Strecke '+fmt(t):'Start').setLatLng(mpts[mpts.length-1]).addTo(map);
}
async function finish(){
  if(pts.length<(tool==='zone'?3:2)) return;
  const id=newId(), o={k:tool,c:col,n:tool==='zone'?'Zone':'Linie',p:pts.slice()};
  resetTemp(); data.shapes[id]=o; redraw(); sh[id].openPopup(); await write(()=>db.put('shapes',id,o));
}
map.on('popupopen',()=>popOpen=1); map.on('popupclose',()=>popOpen=0);
map.on('click',async e=>{
  if(!cmd()||!tool) return;
  const x=e.latlng.lng/1000, y=1-e.latlng.lat/1000;
  if(tool==='line'||tool==='zone'){ pts.push([x,y]); preview(); return; }
  if(tool==='measure'){ mpts.push(e.latlng); mpreview(); return; }
  const id=newId(), o={t:tool,n:TYPES[tool][0],s:'a',x,y};
  data.markers[id]=o; redraw(); mk[id].openPopup(); await write(()=>db.put('markers',id,o));
});
map.on('dblclick',()=>{ if(cmd()&&(tool==='line'||tool==='zone')){ pts.pop(); finish(); } });
map.on('contextmenu',()=>resetTemp());
map.on('mousemove',e=>{ $('#xy').textContent=`X ${Math.round(e.latlng.lng)}  Y ${Math.round(1000-e.latlng.lat)}`; });
document.addEventListener('keydown',e=>{
  if(!cmd()) return;
  if(e.key==='Escape') setTool(null);
  else if(e.key==='Enter'&&(tool==='line'||tool==='zone')&&document.activeElement.tagName!=='INPUT') finish();
});

/* ---- Moduswechsel ---- */
function buildSide(){
  const s=$('#side'); s.replaceChildren(); btns={};
  const mkBtn=(k,label,c)=>{ const b=el('button',label); if(c) b.style.borderLeft='3px solid '+c; b.onclick=()=>setTool(k); btns[k]=b; return b; };
  const t=el('div'); t.className='tools'; for(const [k,v] of Object.entries(TYPES)) t.append(mkBtn(k,v[0],v[2]));
  const d=el('div'); d.className='tools'; d.append(mkBtn('line','Linie'),mkBtn('zone','Zone'),mkBtn('measure','Messen'));
  const sw=el('div'); sw.className='sw';
  COLORS.forEach(c=>{ const b=el('button'); b.style.background=c; if(c===col) b.className='on';
    b.onclick=()=>{ col=c; sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); if(tmp) preview(); }; sw.append(b); });
  const fl=el('div'); fl.className='chips';
  [...Object.entries(TYPES).map(([k,v])=>[k,v[0]]),['line','Linien'],['zone','Zonen']].forEach(([k,n])=>{
    const c=el('button',n); c.className='chip'+(hidden.has(k)?' off':'');
    c.onclick=()=>{ hidden.has(k)?hidden.delete(k):hidden.add(k); c.classList.toggle('off'); redraw(); }; fl.append(c); });
  const l=el('div'); l.id='list'; const st=el('div'); st.id='stat';
  const h3=el('h3','Einträge ('); const c=el('span'); c.id='cnt'; c.style.color='#fff'; h3.append(c,')');
  const out=el('button','Abmelden'); out.id='out'; out.onclick=leave;
  const hint=el('div','Linie/Zone: Punkte klicken, Doppelklick oder Enter beendet. Messen: Rechtsklick setzt zurück. Esc wählt ab.'); hint.style.cssText='font-size:12px;color:#777;margin-top:8px';
  s.append(el('h3','Platzieren'),t,el('h3','Zeichnen'),d,sw,hint,el('h3','Filter'),fl,h3,l,el('h3','Status'),st,out);
}
function boot(done){
  const b=$('#boot'); b.style.display='block'; b.style.opacity=1; b.textContent='';
  const lines=['AUTHENTIFIZIERUNG ........ OK','ZUGANGSEBENE ............. FREIGEGEBEN','VERBINDUNG ZUM KOMMANDONETZ ... OK','LADE LAGEBILD ...'];
  let i=0; const t=setInterval(()=>{ if(i<lines.length){ b.textContent+=lines[i++]+'\n'; } else { clearInterval(t); b.style.opacity=0; setTimeout(()=>{ b.style.display='none'; done(); },500); } },
    matchMedia('(prefers-reduced-motion:reduce)').matches?10:450);
}
function enter(anim){
  const go=()=>{
    sessionStorage.setItem('ls','1'); document.body.classList.add('cmd'); map.doubleClickZoom.disable();
    $('#seal').textContent='DOD'; $('#bt').textContent='Joint Defense Command'; $('#bs').textContent='Strategische Lageübersicht';
    buildSide(); group.addTo(map); map.invalidateSize(); map.fitBounds(KB); sync(); timer=setInterval(sync,5000);
    const tick=()=>$('#clk').textContent=new Date().toLocaleTimeString('de-DE'); tick(); clock=setInterval(tick,1000);
  };
  anim?boot(go):go();
}
function leave(){
  sessionStorage.removeItem('ls'); clearInterval(timer); clearInterval(clock); tool=null; resetTemp(); sel();
  map.removeLayer(group); group.clearLayers(); data={markers:{},shapes:{}}; map.doubleClickZoom.enable();
  document.body.classList.remove('cmd');
  $('#seal').textContent='LS'; $('#bt').textContent='Los Santos Government'; $('#bs').textContent='Amt für Stadtplanung und Geoinformation';
  map.invalidateSize();
}
if(sessionStorage.getItem('ls')) enter(false);
</script>
</body>
